name: Build NSP

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (ImageMagick)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install devkitPro and required packages
        uses: devkitPro/installer-action@v1
        with:
          pacman-packages: |
            switch-dev
            switch-tools
            switch-hacbrewpack

      - name: Set devkitPro environment variables
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITA64=/opt/devkitpro/devkitA64" >> $GITHUB_ENV
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH

      - name: Handle icon (convert icon.png if present)
        run: |
          if [ -f icon.png ]; then
            echo "Converting icon.png to 256x256 JPEG..."
            convert icon.png -resize 256x256 -quality 85 icon.jpg
          else
            echo "No icon.png found; relying on built-in default base64 icon."
          fi

      - name: Build NRO
        run: make

      - name: Locate built NRO
        id: nro
        run: |
          NRO_FILE=$(find . -maxdepth 1 -name "*.nro" | head -n 1)
          if [ -z "$NRO_FILE" ]; then
            echo "No .nro file found! Build may have failed."
            exit 1
          fi
          echo "nro_path=$NRO_FILE" >> $GITHUB_OUTPUT
          echo "Found NRO: $NRO_FILE"

      - name: Generate control.nacp using npdmtool
        run: |
          cat > control.json <<EOF
          {
            "title_id": "0100ABCD12340000",
            "name": "Gemini",
            "author": "Google LLC",
            "version": "1.0.0"
          }
          EOF
          npdmtool --json=control.json --nacp=control.nacp

      - name: Prepare NSP contents
        run: |
          mkdir -p nsp_contents
          cp "${{ steps.nro.outputs.nro_path }}" nsp_contents/exefs.nro
          cp control.nacp nsp_contents/control.nacp
          # Optionally copy icon.jpg if present (hacbrewpack will include it automatically if placed correctly)
          if [ -f icon.jpg ]; then
            cp icon.jpg nsp_contents/icon.jpg
          fi

      - name: Build NSP using hacbrewpack
        run: |
          hacbrewpack -t 0100ABCD12340000 -o Gemini.nsp nsp_contents

      - name: Upload NSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini.nsp
          path: Gemini.nsp
