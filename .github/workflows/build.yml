name: Build Gemini NRO (Web Applet)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          apt-get update -qq
          apt-get install -y imagemagick

      # ----------------------------------------------------------------
      # 1. Write the C wrapper that launches the web browser
      # ----------------------------------------------------------------
      - name: Write main.c
        run: |
          cat << 'EOF' > main.c
          #include <switch.h>
          #include <stdio.h>
          #include <stdlib.h>

          int main(int argc, char **argv) {
              // Mount ROMFS
              if (romfsInit() != 0) {
                  printf("romfsInit failed\n");
                  return 1;
              }

              WebBrowserConfig config;
              webBrowserConfigInitialize(&config);
              config.url = "romfs:/index.html";
              config.enableCache = false;
              config.javascriptEnabled = true;
              config.allowAllFiles = true;

              WebBrowser *browser = NULL;
              Result rc = webBrowserCreate(&config, &browser);
              if (R_FAILED(rc)) {
                  printf("webBrowserCreate failed: %d\n", rc);
                  romfsExit();
                  return 1;
              }

              // Wait for the user to close the browser
              webBrowserWaitForClose(browser);

              // Clean up
              webBrowserClose(browser);
              romfsExit();
              return 0;
          }
          EOF

      # ----------------------------------------------------------------
      # 2. Write a simple Makefile (uses switch_rules)
      # ----------------------------------------------------------------
      - name: Write Makefile
        run: |
          cat << 'MAKEEOF' > Makefile
          ifeq ($(strip $(DEVKITPRO)),)
          $(error "Please set DEVKITPRO in your environment.")
          endif
          include $(DEVKITPRO)/libnx/switch_rules

          APP_TITLE   := Gemini
          APP_AUTHOR  := Google LLC
          APP_VERSION := 1.0
          TARGET      := Gemini
          BUILD       := build
          SOURCES     := .
          DATA        := data
          INCLUDES    := .
          ROMFS       := romfs

          ARCH        := -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE
          CFLAGS      := -g -Wall -O2 -ffunction-sections -fdata-sections $(ARCH) -I$(DEVKITPRO)/libnx/include -D__SWITCH__
          LDFLAGS     := -specs=$(DEVKITPRO)/libnx/switch.specs -g $(ARCH) -Wl,-Map,$(notdir $*.map) -Wl,-z,notext
          LIBS        := -L$(DEVKITPRO)/libnx/lib -lnx

          CFILES      := $(wildcard *.c)
          OFILES      := $(CFILES:.c=.o)

          .PHONY: all clean

          all: $(TARGET).nro

          $(TARGET).nro: $(TARGET).elf
          	@elf2nro $< $@ --icon=icon.jpg --romfsdir=$(ROMFS)

          $(TARGET).elf: $(OFILES)
          	@$(CC) $(LDFLAGS) $(OFILES) $(LIBS) -o $@

          %.o: %.c
          	@$(CC) $(CFLAGS) -c $< -o $@

          clean:
          	@rm -f $(OFILES) $(TARGET).elf $(TARGET).nro
          MAKEEOF

      # ----------------------------------------------------------------
      # 3. Create ROMFS folder and add the HTML/JS files
      # ----------------------------------------------------------------
      - name: Create romfs and write index.html
        run: |
          mkdir -p romfs
          cat << 'EOF' > romfs/index.html
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>Gemini</title>
          <style>
            body { margin:0; background:#1a1a2e; color:#fff; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; }
            #app { width:90%; max-width:800px; }
            #chat { height:60vh; overflow-y:auto; background:#16213e; padding:10px; border-radius:10px; margin-bottom:10px; }
            .msg { padding:8px 12px; margin:4px 0; border-radius:8px; max-width:80%; }
            .user { background:#0066cc; align-self:flex-end; }
            .ai { background:#2d2d44; align-self:flex-start; }
            #q-list { display:flex; flex-wrap:wrap; gap:5px; margin:10px 0; }
            .q-btn { background:#333; color:#fff; border:none; padding:6px 12px; border-radius:20px; cursor:pointer; }
            .q-btn.selected { background:#ffd700; color:#000; }
            #controls button { margin:5px; padding:8px 16px; border-radius:8px; border:none; background:#0066cc; color:#fff; }
          </style>
          </head>
          <body>
          <div id="app">
            <div id="chat"></div>
            <div id="q-list"></div>
            <div id="controls">
              <button id="sendBtn">Send</button>
              <button id="newBtn">New Chat</button>
              <button id="exportBtn">Export</button>
            </div>
            <div id="status" style="margin-top:8px;color:#888;"></div>
          </div>
          <script src="app.js"></script>
          </body>
          </html>
          EOF

      - name: Write app.js
        run: |
          cat << 'EOF' > romfs/app.js
          const API_KEY = "AQ.Ab8RN6KF_Oe4HJByBB_IUhiCDbjHIl8m7jIEoi8zF2BzHu6hCg";
          const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=";
          const presetQuestions = [
            "What is the meaning of life?",
            "Explain quantum computing.",
            "Give me a chocolate cake recipe.",
            "Write a haiku about the ocean.",
            "What are the benefits of exercise?",
            "Tell me a joke."
          ];
          let chats = [{ messages: [] }];
          let currentChat = 0, selectedQuestion = 0;
          const chatDiv = document.getElementById('chat');
          const qDiv = document.getElementById('q-list');
          const statusDiv = document.getElementById('status');

          function renderQuestions() {
            qDiv.innerHTML = '';
            presetQuestions.forEach((q, i) => {
              const btn = document.createElement('button');
              btn.textContent = q;
              btn.className = 'q-btn' + (i === selectedQuestion ? ' selected' : '');
              btn.onclick = () => { selectedQuestion = i; renderQuestions(); };
              qDiv.appendChild(btn);
            });
          }

          function renderChat() {
            const chat = chats[currentChat];
            chatDiv.innerHTML = '';
            chat.messages.forEach(msg => {
              const div = document.createElement('div');
              div.className = 'msg ' + (msg.role === 'user' ? 'user' : 'ai');
              div.textContent = msg.text;
              chatDiv.appendChild(div);
            });
            chatDiv.scrollTop = chatDiv.scrollHeight;
            statusDiv.textContent = `Chat ${currentChat+1}/${chats.length}`;
          }

          async function sendMessage(text) {
            const chat = chats[currentChat];
            chat.messages.push({ role: 'user', text });
            renderChat();
            try {
              const res = await fetch(API_URL + API_KEY, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text }] }] })
              });
              const data = await res.json();
              const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Error';
              chat.messages.push({ role: 'assistant', text: reply });
            } catch(e) {
              chat.messages.push({ role: 'assistant', text: 'Error: ' + e.message });
            }
            renderChat();
          }

          document.getElementById('sendBtn').onclick = () => sendMessage(presetQuestions[selectedQuestion]);
          document.getElementById('newBtn').onclick = () => {
            if (chats.length < 10) { chats.push({ messages: [] }); currentChat = chats.length-1; renderChat(); renderQuestions(); }
          };
          document.getElementById('exportBtn').onclick = () => {
            const text = chats[currentChat].messages.map(m => m.role + ': ' + m.text).join('\n');
            alert(text);
          };

          document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentChat > 0) { currentChat--; renderChat(); }
            if (e.key === 'ArrowRight' && currentChat < chats.length-1) { currentChat++; renderChat(); }
          });

          renderQuestions();
          renderChat();
          EOF

      # ----------------------------------------------------------------
      # 4. Create icon.jpg
      # ----------------------------------------------------------------
      - name: Create icon
        run: |
          if [ -f icon.png ]; then
            convert icon.png -resize 256x256 -quality 90 icon.jpg
          else
            convert -size 256x256 xc:royalblue -quality 90 icon.jpg
          fi

      # ----------------------------------------------------------------
      # 5. Build the NRO
      # ----------------------------------------------------------------
      - name: Build NRO
        run: make

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-NRO
          path: Gemini.nro

      # ======================================================================
