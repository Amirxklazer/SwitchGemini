name: Build GeminiSwitch NSP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup dirs
      run: mkdir -p romfs switch/GeminiSwitch exefs

    - name: Download font
      run: wget -qO romfs/Roboto-Regular.ttf "https://github.com/googlefonts/roboto/raw/main/src/hinted/Roboto-Regular.ttf"

    - name: Create main.c
      run: |
        cat > main.c << 'EOF'
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #include <switch.h>
        #include <SDL2/SDL.h>
        #include <SDL2/SDL_ttf.h>
        #include <curl/curl.h>
        #include <jansson.h>

        #define MAX_SESS 10
        #define MAX_MSG 50
        #define MAX_LEN 4096
        #define MAX_PRESETS 20
        #define W 1280
        #define H 720
        #define FS 22
        #define KEY "AQ.Ab8RN6KF_Oe4HJByBB_IUhiCDbjHIl8m7jIEoi8zF2BzHu6hCg"
        #define URL "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent"

        const char* PRESETS[MAX_PRESETS] = {
          "Hello! How are you?", "What is AI?", "Explain quantum computing",
          "Write a poem about space", "Benefits of exercise?", "Interesting fact?",
          "How does internet work?", "What is ML?", "Coding tip please",
          "Describe solar system", "Good leader qualities?", "Blockchain explained",
          "Book recommendation", "How vaccines work?", "Climate change?",
          "Neural networks", "Tell me a joke", "Meaning of life?",
          "Stay motivated tips", "Productivity advice"
        };

        typedef struct { char t[4096]; int u; } Msg;
        typedef struct { Msg m[50]; int n; char title[64]; } Sess;
        typedef struct { Sess s[10]; int cur,total,preset,load; char st[256]; } App;

        static App app;
        static SDL_Window *win;
        static SDL_Renderer *rd;
        static TTF_Font *fnt;
        static int run = 1;

        size_t wcb(void *c, size_t s, size_t n, void *u) { strncat((char*)u,c,s*n); return s*n; }

        int api(const char *q, char *r) {
          CURL *curl = curl_easy_init();
          if(!curl) return -1;
          char u[512], p[8192];
          snprintf(u,sizeof(u),"%s?key=%s",URL,KEY);
          snprintf(p,sizeof(p),"{\"contents\":[{\"role\":\"user\",\"parts\":[{\"text\":\"%s\"}]}]}",q);
          r[0]=0;
          struct curl_slist *h = curl_slist_append(NULL,"Content-Type: application/json");
          curl_easy_setopt(curl,CURLOPT_URL,u);
          curl_easy_setopt(curl,CURLOPT_POSTFIELDS,p);
          curl_easy_setopt(curl,CURLOPT_HTTPHEADER,h);
          curl_easy_setopt(curl,CURLOPT_WRITEFUNCTION,wcb);
          curl_easy_setopt(curl,CURLOPT_WRITEDATA,r);
          curl_easy_setopt(curl,CURLOPT_TIMEOUT,30L);
          CURLcode res = curl_easy_perform(curl);
          curl_slist_free_all(h);
          curl_easy_cleanup(curl);
          if(res!=CURLE_OK) { snprintf(r,4096,"Err:%s",curl_easy_strerror(res)); return -1; }
          json_error_t e; json_t *root=json_loads(r,0,&e);
          if(!root) return -1;
          json_t *cand=json_object_get(root,"candidates");
          if(cand&&json_array_size(cand)>0) {
            json_t *cont=json_object_get(json_array_get(cand,0),"content");
            if(cont) {
              json_t *parts=json_object_get(cont,"parts");
              if(parts&&json_array_size(parts)>0) {
                const char *txt=json_string_value(json_object_get(json_array_get(parts,0),"text"));
                if(txt) { strncpy(r,txt,4095); r[4095]=0; json_decref(root); return 0; }
              }
            }
          }
          json_decref(root);
          return 0;
        }

        void add(int i,const char *t,int u) {
          Sess *s=&app.s[i];
          if(s->n<50) { strncpy(s->m[s->n].t,t,4095); s->m[s->n].u=u; s->n++; }
        }

        void init() { memset(&app,0,sizeof(app)); app.total=1; strcpy(app.s[0].title,"Chat 1"); strcpy(app.st,"A to send"); }

        void txt(const char *t,int x,int y,SDL_Color c) {
          if(!fnt||!t) return;
          SDL_Surface *sf=TTF_RenderUTF8_Blended(fnt,t,c);
          if(sf) { SDL_Texture *tx=SDL_CreateTextureFromSurface(rd,sf);
            if(tx) { SDL_Rect r={x,y,sf->w,sf->h}; SDL_RenderCopy(rd,tx,NULL,r); SDL_DestroyTexture(tx); }
            SDL_FreeSurface(sf); }
        }

        void render() {
          SDL_SetRenderDrawColor(rd,30,30,46,255); SDL_RenderClear(rd);
          SDL_SetRenderDrawColor(rd,49,50,68,255); SDL_Rect h={0,0,W,60}; SDL_RenderFillRect(rd,&h);
          SDL_Color wh={255,255,255,255},cy={79,172,254,255};
          char b[128]; snprintf(b,sizeof(b),"Gemini AI - Session %d/%d",app.cur+1,app.total); txt(b,20,18,wh);
          Sess *s=&app.s[app.cur]; int y=80;
          for(int i=0;i<s->n&&y<540;i++) {
            Msg *m=&s->m[i]; int bx=m->u?760:20;
            SDL_Color bc=m->u?(SDL_Color){49,50,68,255}:(SDL_Color){69,71,90,255};
            SDL_Color tc=m->u?(SDL_Color){88,166,255,255}:(SDL_Color){139,233,253,255};
            SDL_SetRenderDrawColor(rd,bc.r,bc.g,bc.b,255); SDL_Rect br={bx,y,500,80}; SDL_RenderFillRect(rd,&br);
            char d[200]; strncpy(d,m->t,195); d[195]=0; if(strlen(m->t)>195) strcat(d,"...");
            txt(d,bx+15,y+15,tc); txt(m->u?"You":"Gemini",bx+15,y+55,wh); y+=95;
          }
          SDL_SetRenderDrawColor(rd,40,42,58,255); SDL_Rect pa={0,550,W,170}; SDL_RenderFillRect(rd,&pa);
          SDL_SetRenderDrawColor(rd,79,172,254,255); SDL_RenderDrawLine(rd,0,550,W,550);
          snprintf(b,sizeof(b),"[%d/%d] %s",app.preset+1,MAX_PRESETS,PRESETS[app.preset]); txt(b,565,cy);
          txt("D-Pad:Select A:Send Y:New L/R:Sess ZL:Import ZR:Exp +:Exit",600,wh);
          if(app.loading) { SDL_Color yl={241,250,140,255}; txt("Waiting for Gemini...",635,yl); }
          else txt(app.st,635,wh);
          SDL_RenderPresent(rd);
        }

        void input() {
          hidScanInput(); u64 k=hidKeysDown(CONTROLLER_PAND_AUTO);
          if(k&KEY_DUP) { app.preset=(app.preset-1+MAX_PRESETS)%MAX_PRESETS; snprintf(app.st,sizeof(app.st),"%s",PRESETS[app.preset]); }
          if(k&KEY_DDOWN) { app.preset=(app.preset+1)%MAX_PRESETS; snprintf(app.st,sizeof(app.st),"%s",PRESETS[app.preset]); }
          if(k&KEY_DLEFT) app.preset=(app.preset-5+MAX_PRESETS)%MAX_PRESETS;
          if(k&KEY_DRIGHT) app.preset=(app.preset+5)%MAX_PRESETS;
          if(k&KEY_A&&!app.loading) {
            add(app.cur,PRESETS[app.preset],1); app.loading=1; strcpy(app.st,"Sending...");
            char r[4096]={0}; api(PRESETS[app.preset],r);
            if(strlen(r)>0) add(app.cur,r,0); else add(app.cur,"No response.",0);
            app.loading=0; strcpy(app.st,"Done");
          }
          if(k&KEY_Y&&!app.loading&&app.total<MAX_SESS) { app.total++; app.cur=app.total-1; snprintf(app.s[app.cur].title,64,"Chat %d",app.total); strcpy(app.st,"New session"); }
          if(k&KEY_L&&!app.loading) { app.cur=(app.cur-1+app.total)%app.total; snprintf(app.st,sizeof(app.st),"Sess %d",app.cur+1); }
          if(k&KEY_R&&!app.loading) { app.cur=(app.cur+1)%app.total; snprintf(app.st,sizeof(app.st),"Sess %d",app.cur+1); }
          if(k&KEY_ZL&&!app.loading) {
            FILE *fp=fopen("switch/GeminiSwitch/import.txt","r");
            if(fp) { char b[4096]={0}; if(fgets(b,4095,fp)) { b[strcspn(b,"\n")]=0; if(*b){add(app.cur,b,1);app.loading=1;char r[4096]={0};api(b,r);if(*r)add(app.cur,r,0);app.loading=0;}} fclose(fp);strcpy(app.st,"OK"); }
            else strcpy(app.st,"No file");
          }
          if(k&KEY_ZR&&!app.loading) {
            FILE *fp=fopen("switch/GeminiSwitch/chat_export.txt","w");
            if(fp) { Sess*s=&app.s[app.cur]; fprintf(f,"===Export===\n");for(int i=0;i<s->n;i++)fprintf(fp,"[%s]:%s\n\n",s->m[i].u?"User":"Gem",s->m[i].t);fclose(fp);strcpy(app.st,"Exported"); }
            else strcpy(app.st,"Fail");
          }
          if(k&KEY_PLUS) run=0;
        }

        int main() {
          romfsInit(); socketInitializeDefault(); padConfigureInput(1,PadNpadJoyConPair);
          if(SDL_Init(SDL_INIT_VIDEO)<0) return 1;
          if(TTF_Init()<0) { SDL_Quit(); return 1; }
          fnt=TTF_OpenFont("romfs:/Roboto-Regular.ttf",FS);
          if(!fnt) { TTF_Quit(); SDL_Quit(); return 1; }
          win=SDL_CreateWindow("Gemini",SDL_WINDOWPOS_CENTERED,SDL_WINDOWPOS_CENTERED,W,H,SDL_WINDOW_SHOWN);
          if(!win) { TTF_CloseFont(fnt); TTF_Quit(); SDL_Quit(); return 1; }
          rd=SDL_CreateRenderer(win,-1,SDL_RENDERER_ACCELERATED|SDL_RENDERER_PRESENTVSYNC);
          if(!rd) { SDL_DestroyWindow(win); TTF_CloseFont(fnt); TTF_Quit(); SDL_Quit(); return 1; }
          init();
          while(appletMainLoop()) { input(); render(); if(!run) break; SDL_Delay(16); }
          SDL_DestroyRenderer(rd); SDL_DestroyWindow(win); TTF_CloseFont(fnt); TTF_Quit(); SDL_Quit(); socketExit(); romfsExit();
          return 0;
        }
        EOF

    - name: Create Makefile (base64 method)
      run: |
        echo '' | base64 -d > Makefile

    - name: Verify Makefile tabs
      run: |
        echo "=== Checking for tabs ==="
        grep -Pn '^\t' Makefile | head -10
        echo ""
        echo "=== Line 23 ==="
        sed -n '23p' Makefile | cat -A

    - name: Build
      run: |
        export DEVKITPRO=/opt/devkitpro
        export PATH=$DEVKITPRO/tools/bin:$PATH
        make -j$(nproc)

    - name: Check output
      run: ls -la *.nsp && echo "SUCCESS" || echo "FAILED"

    - name: Upload NSP
      uses: actions/upload-artifact@v4
      with:
        name: geminiswitch-nsp
        path: "*.nsp"
