name: Build Gemini NRO (HTML-Video-Template-NX)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install devkitPro
        uses: devkitPro/installer-action@v1
        with:
          pacman-packages: switch-dev

      - name: Clone HTML-Video-Template-NX
        run: |
          git clone --depth 1 https://github.com/XorTroll/HTML-Video-Template-NX.git template
          cp -r template/* .
          rm -rf template

      - name: Write index.html & app.js
        run: |
          cat << 'EOF' > html/index.html
          <!-- full HTML, same as before -->
          EOF
          cat << 'EOF' > html/app.js
          // full app.js, same as before
          EOF

      - name: Convert or create icon
        run: |
          if [ -f icon.png ]; then convert icon.png -resize 256x256 icon.jpg; else convert -size 256x256 xc:royalblue icon.jpg; fi

      - name: Build
        run: make

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-NRO
          path: Gemini.nro
