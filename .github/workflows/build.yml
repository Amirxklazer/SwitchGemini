name: Build Gemini NRO (2000+ lines)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install system dependencies (ImageMagick)
        run: |
          apt-get update -qq
          apt-get install -y imagemagick

      - name: Install all required Switch libraries
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S switch-sdl2 switch-sdl2_ttf switch-sdl2_image \
                        switch-freetype switch-harfbuzz switch-libjpeg-turbo \
                        switch-libpng switch-libwebp switch-curl switch-jansson --noconfirm

      - name: Set PKG_CONFIG_PATH
        run: |
          echo "PKG_CONFIG_PATH=/opt/devkitpro/portlibs/switch/lib/pkgconfig" >> $GITHUB_ENV

      - name: Prepare ROMFS and download font
        run: |
          mkdir -p romfs
          curl -L -o romfs/Roboto-Regular.ttf \
            "https://github.com/google/fonts/raw/main/apache/roboto/Roboto-Regular.ttf"

      - name: Create icon (icon.jpg)
        run: |
          if [ -f icon.png ]; then
            convert icon.png -resize 256x256 -quality 90 icon.jpg
          else
            convert -size 256x256 xc:royalblue -quality 90 icon.jpg
          fi

      - name: Write main.c (with romfsInit, socket init, SDL video only)
        run: |
          cat << 'EOF' > main.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdbool.h>
          #include <sys/stat.h>
          #include <unistd.h>
          #include <switch.h>
          #include <SDL2/SDL.h>
          #include <SDL2/SDL_ttf.h>
          #include <curl/curl.h>
          #include <jansson.h>

          // ----------------------------
          // Constants
          // ----------------------------
          #define MAX_CHATS 10
          #define MAX_MESSAGES 50
          #define MAX_TEXT_LEN 1024
          #define PRESET_QUESTIONS 6
          #define MAX_RESPONSE_LEN 4096
          #define GEMINI_API_KEY "AQ.Ab8RN6KF_Oe4HJByBB_IUhiCDbjHIl8m7jIEoi8zF2BzHu6hCg"
          #define API_URL "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="
          #define IMPORT_PATH "/switch/GeminiSwitch/import.txt"
          #define EXPORT_PATH "/switch/GeminiSwitch/chat_export.txt"

          // ----------------------------
          // Data structures
          // ----------------------------
          typedef struct {
              char role[10];
              char text[MAX_TEXT_LEN];
          } Message;

          typedef struct {
              Message msgs[MAX_MESSAGES];
              int msg_count;
          } Chat;

          static Chat chats[MAX_CHATS];
          static int chat_count = 1;
          static int current_chat = 0;

          static const char *preset_questions[] = {
              "What is the meaning of life?",
              "Explain quantum computing in simple terms.",
              "Give me a recipe for chocolate cake.",
              "Write a haiku about the ocean.",
              "What are the benefits of exercise?",
              "Tell me a joke."
          };
          static int selected_question = 0;

          static SDL_Window   *window = NULL;
          static SDL_Renderer *renderer = NULL;
          static TTF_Font     *font = NULL;
          static bool running = true;

          // ----------------------------
          // Helper functions
          // ----------------------------
          static void ensure_dir(const char *path) {
              char tmp[256];
              char *p;
              snprintf(tmp, sizeof(tmp), "%s", path);
              for (p = tmp + 1; *p; p++) {
                  if (*p == '/') {
                      *p = 0;
                      mkdir(tmp, 0755);
                      *p = '/';
                  }
              }
              mkdir(tmp, 0755);
          }

          static void add_message(Chat *chat, const char *role, const char *text) {
              if (chat->msg_count >= MAX_MESSAGES) return;
              Message *msg = &chat->msgs[chat->msg_count++];
              snprintf(msg->role, sizeof(msg->role), "%s", role);
              snprintf(msg->text, sizeof(msg->text), "%s", text);
          }

          static void clear_chat(Chat *chat) {
              chat->msg_count = 0;
          }

          static size_t write_callback(void *contents, size_t size, size_t nmemb, void *userp) {
              size_t total = size * nmemb;
              char **response_ptr = (char**)userp;
              *response_ptr = realloc(*response_ptr, strlen(*response_ptr) + total + 1);
              if (!*response_ptr) return 0;
              strncat(*response_ptr, (char*)contents, total);
              return total;
          }

          static bool send_to_gemini(const char *user_text, char *response_out, size_t out_size) {
              CURL *curl;
              CURLcode res;
              char *json_payload = NULL;
              char *response_data = NULL;
              bool success = false;

              json_t *root = json_object();
              json_t *contents = json_array();
              json_t *parts = json_array();
              json_t *part = json_object();
              json_t *text_obj = json_string(user_text);
              json_object_set(part, "text", text_obj);
              json_array_append(parts, part);
              json_t *parts_container = json_object();
              json_object_set(parts_container, "parts", parts);
              json_array_append(contents, parts_container);
              json_object_set(root, "contents", contents);

              json_payload = json_dumps(root, JSON_COMPACT);
              json_decref(root);

              char url[512];
              snprintf(url, sizeof(url), "%s%s", API_URL, GEMINI_API_KEY);

              curl_global_init(CURL_GLOBAL_ALL);
              curl = curl_easy_init();
              if (curl) {
                  struct curl_slist *headers = NULL;
                  headers = curl_slist_append(headers, "Content-Type: application/json");

                  curl_easy_setopt(curl, CURLOPT_URL, url);
                  curl_easy_setopt(curl, CURLOPT_POSTFIELDS, json_payload);
                  curl_easy_setopt(curl, CURLOPT_HTTPHEADER, headers);
                  curl_easy_setopt(curl, CURLOPT_WRITEFUNCTION, write_callback);
                  curl_easy_setopt(curl, CURLOPT_WRITEDATA, &response_data);
                  curl_easy_setopt(curl, CURLOPT_TIMEOUT, 30L);

                  res = curl_easy_perform(curl);
                  if (res == CURLE_OK && response_data) {
                      json_error_t error;
                      json_t *root_resp = json_loads(response_data, 0, &error);
                      if (root_resp) {
                          json_t *candidates = json_object_get(root_resp, "candidates");
                          if (candidates && json_is_array(candidates)) {
                              json_t *first = json_array_get(candidates, 0);
                              if (first) {
                                  json_t *content = json_object_get(first, "content");
                                  if (content) {
                                      json_t *parts_arr = json_object_get(content, "parts");
                                      if (parts_arr && json_is_array(parts_arr)) {
                                          json_t *first_part = json_array_get(parts_arr, 0);
                                          if (first_part) {
                                              json_t *text_json = json_object_get(first_part, "text");
                                              if (text_json && json_is_string(text_json)) {
                                                  const char *text = json_string_value(text_json);
                                                  strncpy(response_out, text, out_size-1);
                                                  response_out[out_size-1] = '\0';
                                                  success = true;
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                          json_decref(root_resp);
                      }
                  }
                  curl_easy_cleanup(curl);
                  curl_slist_free_all(headers);
              }
              curl_global_cleanup();

              free(json_payload);
              free(response_data);
              return success;
          }

          static void import_chat() {
              FILE *f = fopen(IMPORT_PATH, "r");
              if (!f) return;
              char line[MAX_TEXT_LEN];
              if (fgets(line, sizeof(line), f)) {
                  line[strcspn(line, "\n")] = '\0';
                  add_message(&chats[current_chat], "user", line);
                  char response[MAX_RESPONSE_LEN];
                  if (send_to_gemini(line, response, sizeof(response))) {
                      add_message(&chats[current_chat], "assistant", response);
                  } else {
                      add_message(&chats[current_chat], "assistant", "Error: API call failed.");
                  }
              }
              fclose(f);
              remove(IMPORT_PATH);
          }

          static void export_chat() {
              ensure_dir("/switch/GeminiSwitch");
              FILE *f = fopen(EXPORT_PATH, "w");
              if (!f) return;
              Chat *chat = &chats[current_chat];
              for (int i = 0; i < chat->msg_count; i++) {
                  fprintf(f, "%s: %s\n", chat->msgs[i].role, chat->msgs[i].text);
              }
              fclose(f);
          }

          static void render_text(SDL_Renderer *ren, TTF_Font *font,
                                  const char *text, int x, int y,
                                  SDL_Color color, SDL_Rect *rect_out) {
              SDL_Surface *surf = TTF_RenderUTF8_Blended(font, text, color);
              if (!surf) return;
              SDL_Texture *tex = SDL_CreateTextureFromSurface(ren, surf);
              SDL_Rect rect = {x, y, surf->w, surf->h};
              SDL_RenderCopy(ren, tex, NULL, &rect);
              if (rect_out) *rect_out = rect;
              SDL_FreeSurface(surf);
              SDL_DestroyTexture(tex);
          }

          static void render_chat() {
              SDL_SetRenderDrawColor(renderer, 30, 30, 30, 255);
              SDL_RenderClear(renderer);

              SDL_Rect chat_area = {10, 10, 1220, 550};
              SDL_SetRenderDrawColor(renderer, 50, 50, 50, 255);
              SDL_RenderFillRect(renderer, &chat_area);

              Chat *chat = &chats[current_chat];
              int y = 20;
              int max_y = 540;
              SDL_Color user_color = {100, 200, 255, 255};
              SDL_Color ass_color = {200, 255, 200, 255};

              for (int i = 0; i < chat->msg_count && y < max_y; i++) {
                  char label[20];
                  snprintf(label, sizeof(label), "%s: ", chat->msgs[i].role);
                  char combined[MAX_TEXT_LEN + 20];
                  snprintf(combined, sizeof(combined), "%s%s", label, chat->msgs[i].text);
                  SDL_Color col = (strcmp(chat->msgs[i].role, "user") == 0) ? user_color : ass_color;
                  SDL_Rect rect;
                  render_text(renderer, font, combined, 20, y, col, &rect);
                  y += rect.h + 5;
                  if (y > max_y) break;
              }

              int q_x = 20, q_y = 580, q_spacing = 40;
              SDL_Color q_normal = {200, 200, 200, 255};
              SDL_Color q_selected = {255, 255, 100, 255};
              for (int i = 0; i < PRESET_QUESTIONS; i++) {
                  SDL_Color col = (i == selected_question) ? q_selected : q_normal;
                  SDL_Rect rect;
                  render_text(renderer, font, preset_questions[i], q_x, q_y + i*q_spacing, col, &rect);
              }

              char info[256];
              snprintf(info, sizeof(info),
                       "Chat %d/%d | L/R: switch | Y: new | ZL(trigger): import | ZR(trigger): export | Plus: exit",
                       current_chat+1, chat_count);
              SDL_Color info_col = {180, 180, 180, 255};
              render_text(renderer, font, info, 20, 700, info_col, NULL);

              SDL_RenderPresent(renderer);
          }

          // ----------------------------
          // Main
          // ----------------------------
          int main(int argc, char *argv[]) {
              // --- CRUCIAL: mount ROMFS ---
              if (romfsInit() != 0) {
                  printf("romfsInit failed!\n");
                  return 1;
              }

              // --- CRUCIAL: initialize sockets (required for libcurl) ---
              socketInitializeDefault();
              // Optional: redirect stdout to nxlink for debugging
              // nxlinkStdio();

              if (SDL_Init(SDL_INIT_VIDEO) < 0) {
                  printf("SDL_Init failed\n");
                  socketExit();
                  romfsExit();
                  return 1;
              }
              if (TTF_Init() < 0) {
                  printf("TTF_Init failed\n");
                  SDL_Quit();
                  socketExit();
                  romfsExit();
                  return 1;
              }

              window = SDL_CreateWindow("Gemini", SDL_WINDOWPOS_CENTERED, SDL_WINDOWPOS_CENTERED,
                                       1280, 720, SDL_WINDOW_SHOWN);
              if (!window) {
                  printf("Window creation failed\n");
                  TTF_Quit();
                  SDL_Quit();
                  socketExit();
                  romfsExit();
                  return 1;
              }
              renderer = SDL_CreateRenderer(window, -1, SDL_RENDERER_ACCELERATED | SDL_RENDERER_PRESENTVSYNC);
              if (!renderer) {
                  printf("Renderer creation failed\n");
                  SDL_DestroyWindow(window);
                  TTF_Quit();
                  SDL_Quit();
                  socketExit();
                  romfsExit();
                  return 1;
              }

              // Load font from ROMFS
              font = TTF_OpenFont("romfs:/Roboto-Regular.ttf", 22);
              if (!font) {
                  printf("Font load from romfs failed, trying local...\n");
                  font = TTF_OpenFont("Roboto-Regular.ttf", 22);
                  if (!font) {
                      printf("Font load failed\n");
                      SDL_DestroyRenderer(renderer);
                      SDL_DestroyWindow(window);
                      TTF_Quit();
                      SDL_Quit();
                      socketExit();
                      romfsExit();
                      return 1;
                  }
              }

              clear_chat(&chats[0]);

              // Main loop – keyboard only for now
              while (running) {
                  SDL_Event e;
                  while (SDL_PollEvent(&e)) {
                      if (e.type == SDL_QUIT) { running = false; }
                      else if (e.type == SDL_KEYDOWN) {
                          switch (e.key.keysym.sym) {
                              case SDLK_UP:    selected_question = (selected_question - 1 + PRESET_QUESTIONS) % PRESET_QUESTIONS; break;
                              case SDLK_DOWN:  selected_question = (selected_question + 1) % PRESET_QUESTIONS; break;
                              case SDLK_RETURN:
                              case SDLK_SPACE: {
                                  const char *q = preset_questions[selected_question];
                                  add_message(&chats[current_chat], "user", q);
                                  char resp[MAX_RESPONSE_LEN];
                                  if (send_to_gemini(q, resp, sizeof(resp)))
                                      add_message(&chats[current_chat], "assistant", resp);
                                  else
                                      add_message(&chats[current_chat], "assistant", "Error");
                                  break;
                              }
                              case SDLK_l: case SDLK_LEFT:  if (current_chat > 0) current_chat--; break;
                              case SDLK_r: case SDLK_RIGHT: if (current_chat < chat_count-1) current_chat++; break;
                              case SDLK_y: if (chat_count < MAX_CHATS) { clear_chat(&chats[chat_count]); current_chat = chat_count; chat_count++; } break;
                              case SDLK_i: import_chat(); break;
                              case SDLK_e: export_chat(); break;
                              case SDLK_ESCAPE: running = false; break;
                              default: break;
                          }
                      }
                  }
                  render_chat();
                  SDL_Delay(16);
              }

              TTF_CloseFont(font);
              SDL_DestroyRenderer(renderer);
              SDL_DestroyWindow(window);
              TTF_Quit();
              SDL_Quit();

              // --- cleanup ---
              socketExit();
              romfsExit();

              return 0;
          }
          EOF

      - name: Write Makefile (using pkg-config)
        run: |
          cat << 'MAKEEOF' > Makefile
          ifeq ($(strip $(DEVKITPRO)),)
          $(error "Please set DEVKITPRO in your environment.")
          endif
          include $(DEVKITPRO)/libnx/switch_rules
          APP_TITLE   := Gemini
          APP_AUTHOR  := Google LLC
          APP_VERSION := 1.0
          TARGET      := Gemini
          BUILD       := build
          SOURCES     := .
          DATA        := data
          INCLUDES    := .
          SDL2_PREFIX := $(DEVKITPRO)/portlibs/switch
          PKG_CONFIG_PATH := $(SDL2_PREFIX)/lib/pkgconfig
          export PKG_CONFIG_PATH
          SDL2_INC    := $(shell PKG_CONFIG_PATH=$(SDL2_PREFIX)/lib/pkgconfig pkg-config --cflags sdl2 SDL2_ttf)
          SDL2_LIBS   := $(shell PKG_CONFIG_PATH=$(SDL2_PREFIX)/lib/pkgconfig pkg-config --static --libs sdl2 SDL2_ttf)
          CURL_LIBS   := $(shell PKG_CONFIG_PATH=$(SDL2_PREFIX)/lib/pkgconfig pkg-config --static --libs libcurl)
          JANSSON_LIBS:= $(shell PKG_CONFIG_PATH=$(SDL2_PREFIX)/lib/pkgconfig pkg-config --static --libs jansson)
          export INCLUDE := $(foreach dir,$(INCLUDES),-I$(TOPDIR)/$(dir)) -I$(DEVKITPRO)/libnx/include -I$(DEPSDIR) $(SDL2_INC)
          ARCH        := -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE
          CFLAGS      := -g -Wall -O2 -ffunction-sections -fdata-sections $(ARCH) $(INCLUDE) -D__SWITCH__
          CXXFLAGS    := $(CFLAGS) -fno-rtti -fno-exceptions
          ASFLAGS     := -g $(ARCH)
          LDFLAGS     := -specs=$(DEVKITPRO)/libnx/switch.specs -g $(ARCH) -Wl,-Map,$(notdir $*.map) -Wl,-z,notext
          LIBS        := -L$(DEVKITPRO)/libnx/lib -L$(SDL2_PREFIX)/lib -lnx $(SDL2_LIBS) $(CURL_LIBS) $(JANSSON_LIBS) -lfreetype -lharfbuzz -lpng -lbz2 -ljpeg -lz -lm -lpthread
          ifneq ($(BUILD),$(notdir $(CURDIR)))
          export OUTPUT   := $(CURDIR)/$(TARGET)
          export TOPDIR   := $(CURDIR)
          export VPATH    := $(foreach dir,$(SOURCES),$(CURDIR)/$(dir)) \
                              $(foreach dir,$(DATA),$(CURDIR)/$(dir))
          export DEPSDIR  := $(CURDIR)/$(BUILD)
          CFILES      := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.c)))
          CPPFILES    := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.cpp)))
          SFILES      := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.s)))
          export OFILES   := $(CFILES:.c=.o) $(CPPFILES:.cpp=.o) $(SFILES:.s=.o)
          .PHONY: $(BUILD) clean all
          all: $(BUILD)
          $(BUILD):
          	@[ -d $@ ] || mkdir -p $@
          	@$(MAKE) --no-print-directory -C $@ -f $(CURDIR)/Makefile
          clean:
          	@echo clean ...
          	@rm -fr $(BUILD) $(TARGET).elf $(TARGET).nro $(TARGET).nacp
          else
          DEPENDS := $(OFILES:.o=.d)
          $(OUTPUT).nro: $(OUTPUT).elf
          $(OUTPUT).elf: $(OFILES)
          	$(CXX) $(LDFLAGS) $(OFILES) $(LIBS) -o $@
          -include $(DEPENDS)
          endif
          MAKEEOF

      - name: Build Homebrew
        run: make -f Makefile

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-NRO
          path: ./*.nro

